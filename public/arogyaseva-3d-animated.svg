<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 520" width="100%" height="100%">
  <defs>
    <!-- Background Gradients -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#050814" />
      <stop offset="50%" stop-color="#0c1527" />
      <stop offset="100%" stop-color="#070c18" />
    </linearGradient>

    <linearGradient id="accentCyan" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00f2fe" />
      <stop offset="100%" stop-color="#4facfe" />
    </linearGradient>

    <linearGradient id="pulseRed" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ff0844" />
      <stop offset="100%" stop-color="#ffb199" />
    </linearGradient>

    <linearGradient id="emeraldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#10b981" />
      <stop offset="100%" stop-color="#059669" />
    </linearGradient>

    <linearGradient id="cardGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#162238" stop-opacity="0.9" />
      <stop offset="100%" stop-color="#0d1829" stop-opacity="0.95" />
    </linearGradient>

    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fbbf24" />
      <stop offset="100%" stop-color="#d97706" />
    </linearGradient>

    <!-- Glow Filters -->
    <filter id="glowCyan" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="5" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>

    <filter id="glowRed" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="6" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>

    <filter id="cardShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="12" stdDeviation="15" flood-color="#000000" flood-opacity="0.6" />
    </filter>

    <!-- Embedded CSS Keyframe Animations -->
    <style>
      @keyframes floatSlow {
        0%, 100% { transform: translateY(0px) rotate(0deg); }
        50% { transform: translateY(-12px) rotate(0.8deg); }
      }
      @keyframes floatCard1 {
        0%, 100% { transform: translateY(0px) translateZ(0); }
        50% { transform: translateY(-14px) translateZ(30px); }
      }
      @keyframes floatCard2 {
        0%, 100% { transform: translateY(0px); }
        50% { transform: translateY(-10px); }
      }
      @keyframes floatCard3 {
        0%, 100% { transform: translateY(0px); }
        50% { transform: translateY(-16px); }
      }
      @keyframes ecgPulse {
        0% { stroke-dashoffset: 1200; }
        100% { stroke-dashoffset: 0; }
      }
      @keyframes radarSweep {
        0% { transform: rotate(0deg); }
        100% { transform: rotate(360deg); }
      }
      @keyframes beaconPing {
        0% { r: 6; opacity: 1; }
        100% { r: 24; opacity: 0; }
      }
      @keyframes scanGrid {
        0% { transform: translateY(0px); opacity: 0.1; }
        50% { opacity: 0.35; }
        100% { transform: translateY(220px); opacity: 0.1; }
      }
      @keyframes dataStream {
        0% { stroke-dashoffset: 400; }
        100% { stroke-dashoffset: 0; }
      }
      @keyframes rotate3dCross {
        0% { transform: rotateY(0deg) rotateX(15deg); }
        50% { transform: rotateY(180deg) rotateX(25deg); }
        100% { transform: rotateY(360deg) rotateX(15deg); }
      }
      @keyframes glowPulse {
        0%, 100% { opacity: 0.8; }
        50% { opacity: 1; filter: drop-shadow(0 0 12px #38bdf8); }
      }

      .ecg-line {
        stroke-dasharray: 1200;
        animation: ecgPulse 3.5s linear infinite;
      }
      .card-1 {
        animation: floatCard1 4s ease-in-out infinite;
      }
      .card-2 {
        animation: floatCard2 5s ease-in-out infinite 0.6s;
      }
      .card-3 {
        animation: floatCard3 4.5s ease-in-out infinite 1.2s;
      }
      .radar-needle {
        transform-origin: 960px 240px;
        animation: radarSweep 6s linear infinite;
      }
      .ping-beacon {
        animation: beaconPing 2s cubic-bezier(0, 0.2, 0.8, 1) infinite;
      }
      .grid-scanner {
        animation: scanGrid 4s ease-in-out infinite;
      }
      .stream-wire {
        stroke-dasharray: 16, 16;
        animation: dataStream 2s linear infinite;
      }
      .floating-hero {
        animation: floatSlow 6s ease-in-out infinite;
      }
      .hud-text {
        font-family: 'JetBrains Mono', 'Courier New', monospace;
      }
      .title-text {
        font-family: 'Outfit', 'Plus Jakarta Sans', system-ui, -apple-system, sans-serif;
      }
    </style>
  </defs>

  <!-- Base Dark Canvas -->
  <rect width="1200" height="520" rx="24" fill="url(#bgGrad)" />
  <rect width="1198" height="518" x="1" y="1" rx="23" fill="none" stroke="#1e293b" stroke-width="2" />

  <!-- 3D Perspective Isometric Grid Base (Ground plane) -->
  <g opacity="0.35" transform="translate(0, 200)">
    <!-- Perspective Grid Lines -->
    <path d="M 50 300 L 400 60 M 150 300 L 450 60 M 250 300 L 500 60 M 350 300 L 550 60 M 450 300 L 600 60
             M 550 300 L 650 60 M 650 300 L 700 60 M 750 300 L 750 60 M 850 300 L 800 60 M 950 300 L 850 60
             M 1050 300 L 900 60 M 1150 300 L 950 60"
          stroke="#0284c7" stroke-width="1" stroke-opacity="0.4" />

    <!-- Cross horizontal grid lines -->
    <line x1="100" y1="260" x2="1100" y2="260" stroke="#0284c7" stroke-width="1" stroke-opacity="0.6" />
    <line x1="200" y1="210" x2="1000" y2="210" stroke="#0284c7" stroke-width="1" stroke-opacity="0.5" />
    <line x1="300" y1="160" x2="900" y2="160" stroke="#0284c7" stroke-width="1" stroke-opacity="0.4" />
    <line x1="380" y1="110" x2="820" y2="110" stroke="#0284c7" stroke-width="1" stroke-opacity="0.3" />
    <line x1="440" y1="70" x2="760" y2="70" stroke="#0284c7" stroke-width="1" stroke-opacity="0.2" />

    <!-- Traveling Laser Scan Line on 3D Ground -->
    <line class="grid-scanner" x1="100" y1="70" x2="1100" y2="70" stroke="#38bdf8" stroke-width="3" filter="url(#glowCyan)" />
  </g>

  <!-- Ambient Light Orbs (Cyan & Crimson) -->
  <circle cx="200" cy="140" r="180" fill="#0284c7" opacity="0.12" filter="url(#glowCyan)" />
  <circle cx="1020" cy="380" r="160" fill="#dc2626" opacity="0.1" filter="url(#glowRed)" />
  <circle cx="600" cy="200" r="220" fill="#0369a1" opacity="0.08" />

  <!-- Animated Data Flow Curves / Stream Wires -->
  <path class="stream-wire" d="M 80 440 C 260 420, 320 280, 520 280 C 720 280, 780 180, 960 220"
        fill="none" stroke="#0ea5e9" stroke-width="2" opacity="0.5" />
  <path class="stream-wire" d="M 280 160 C 440 160, 540 380, 740 380 C 880 380, 980 320, 1120 340"
        fill="none" stroke="#38bdf8" stroke-width="1.5" opacity="0.4" />

  <!-- LEFT HERO TYPOGRAPHY & BRAND -->
  <g transform="translate(70, 75)">
    <!-- Top System Category Badge -->
    <g>
      <rect x="0" y="0" width="230" height="28" rx="8" fill="#0f1f38" stroke="#0284c7" stroke-width="1" />
      <circle cx="14" cy="14" r="4" fill="#10b981" />
      <circle cx="14" cy="14" r="8" fill="none" stroke="#10b981" stroke-width="1.5" class="ping-beacon" />
      <text x="28" y="18" fill="#38bdf8" font-size="11" font-weight="700" class="hud-text" letter-spacing="1.5">RURAL AI HEALTHCARE GRID</text>
    </g>

    <!-- Main Title -->
    <text x="0" y="78" fill="#ffffff" font-size="44" font-weight="900" class="title-text" letter-spacing="-1">
      Arogya<tspan fill="#38bdf8">Seva</tspan> <tspan fill="#ef4444">AI</tspan>
    </text>

    <!-- Subtitle / Mission -->
    <text x="0" y="112" fill="#94a3b8" font-size="16" font-weight="500" class="title-text">
      Offline-First Clinical Triage, Voice AI &amp; Emergency Referral Network
    </text>

    <!-- Live ECG Rhythm Wave Banner Under Title -->
    <g transform="translate(0, 135)">
      <rect x="0" y="0" width="460" height="42" rx="10" fill="#0a1222" stroke="#1e293b" stroke-width="1" />
      <path class="ecg-line"
            d="M 10 21 L 70 21 L 80 10 L 95 32 L 105 5 L 115 36 L 125 16 L 135 21 L 220 21 L 230 10 L 245 32 L 255 5 L 265 36 L 275 16 L 285 21 L 370 21 L 380 10 L 395 32 L 405 5 L 415 36 L 425 16 L 435 21 L 450 21"
            fill="none" stroke="#00f2fe" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" filter="url(#glowCyan)" />
      <text x="355" y="14" fill="#38bdf8" font-size="9" font-weight="700" class="hud-text">SpO2 98% • 72 BPM</text>
    </g>

    <!-- Key Tech Capability Chips -->
    <g transform="translate(0, 200)">
      <g transform="translate(0, 0)">
        <rect x="0" y="0" width="138" height="30" rx="8" fill="#111c30" stroke="#334155" stroke-width="1" />
        <text x="12" y="19" fill="#e2e8f0" font-size="11" font-weight="600" class="title-text">🎙️ Multi-lingual Voice</text>
      </g>
      <g transform="translate(148, 0)">
        <rect x="0" y="0" width="146" height="30" rx="8" fill="#111c30" stroke="#334155" stroke-width="1" />
        <text x="12" y="19" fill="#e2e8f0" font-size="11" font-weight="600" class="title-text">⚡ Offline Risk Engine</text>
      </g>
      <g transform="translate(304, 0)">
        <rect x="0" y="0" width="156" height="30" rx="8" fill="#111c30" stroke="#334155" stroke-width="1" />
        <text x="12" y="19" fill="#e2e8f0" font-size="11" font-weight="600" class="title-text">🗺️ OSM &amp; Overpass API</text>
      </g>
    </g>

    <!-- Lower Status Indicators -->
    <g transform="translate(0, 252)">
      <text x="0" y="14" fill="#64748b" font-size="12" class="hud-text">
        CORE PROTOCOLS: <tspan fill="#38bdf8">ICMR</tspan> • <tspan fill="#38bdf8">WHO ETAT</tspan> • <tspan fill="#38bdf8">FHIR SBAR</tspan> • <tspan fill="#10b981">108 ALS DISPATCH</tspan>
      </text>
    </g>
  </g>

  <!-- RIGHT 3D HOLOGRAPHIC STACK (Interactive Medical HUD) -->

  <!-- Radar Arc Display (GIS / GPS Telemetry Target) -->
  <g transform="translate(10, 0)">
    <!-- Radar Rings -->
    <circle cx="960" cy="240" r="140" fill="none" stroke="#0369a1" stroke-width="1" stroke-dasharray="4, 4" opacity="0.3" />
    <circle cx="960" cy="240" r="95" fill="none" stroke="#0ea5e9" stroke-width="1" opacity="0.4" />
    <circle cx="960" cy="240" r="50" fill="none" stroke="#38bdf8" stroke-width="1.5" opacity="0.5" />
    <line x1="820" y1="240" x2="1100" y2="240" stroke="#0ea5e9" stroke-width="1" opacity="0.3" />
    <line x1="960" y1="100" x2="960" y2="380" stroke="#0ea5e9" stroke-width="1" opacity="0.3" />

    <!-- Sweeping Radar Needle -->
    <line class="radar-needle" x1="960" y1="240" x2="1080" y2="180" stroke="#00f2fe" stroke-width="2.5" filter="url(#glowCyan)" />
  </g>

  <!-- 3D FLOATING HUD CARD 1: CLINICAL EMERGENCY TRIAGE -->
  <g class="card-1" transform="translate(680, 50)" filter="url(#cardShadow)">
    <rect x="0" y="0" width="270" height="120" rx="16" fill="url(#cardGrad)" stroke="#ef4444" stroke-width="1.5" />
    <!-- Header strip -->
    <rect x="12" y="12" width="115" height="20" rx="6" fill="#450a0a" />
    <circle cx="22" cy="22" r="3.5" fill="#ef4444" />
    <circle cx="22" cy="22" r="7" fill="none" stroke="#ef4444" stroke-width="1" class="ping-beacon" />
    <text x="32" y="26" fill="#fca5a5" font-size="9" font-weight="800" class="hud-text">URGENT PRIORITY</text>

    <!-- Score Big Display -->
    <text x="210" y="32" fill="#ef4444" font-size="22" font-weight="900" class="hud-text">92<tspan font-size="12" fill="#94a3b8">/100</tspan></text>

    <text x="14" y="60" fill="#ffffff" font-size="13" font-weight="700" class="title-text">Acute Respiratory Distress</text>
    <text x="14" y="78" fill="#94a3b8" font-size="10" class="hud-text">SpO2 88% • RR 28 • High-Flow O2</text>

    <line x1="14" y1="88" x2="256" y2="88" stroke="#334155" stroke-width="1" />
    <text x="14" y="105" fill="#38bdf8" font-size="10" font-weight="600" class="hud-text">Target: District Civil Hospital (24km)</text>
  </g>

  <!-- 3D FLOATING HUD CARD 2: REAL-TIME GPS & OVERPASS OSM -->
  <g class="card-2" transform="translate(860, 190)" filter="url(#cardShadow)">
    <rect x="0" y="0" width="280" height="135" rx="16" fill="url(#cardGrad)" stroke="#0284c7" stroke-width="1.5" />
    <rect x="12" y="12" width="145" height="20" rx="6" fill="#082f49" />
    <circle cx="22" cy="22" r="3.5" fill="#38bdf8" />
    <text x="32" y="26" fill="#7dd3fc" font-size="9" font-weight="800" class="hud-text">LIVE OSM OVERPASS</text>

    <text x="14" y="58" fill="#ffffff" font-size="14" font-weight="700" class="title-text">GPS: 28.6139°N, 77.2090°E</text>
    <text x="14" y="76" fill="#10b981" font-size="10" font-weight="600" class="hud-text">● 14 Hospitals Discovered (OSM)</text>
    <text x="14" y="93" fill="#94a3b8" font-size="10" class="hud-text">Bed Availability: 42 Normal / 8 ICU</text>

    <rect x="14" y="104" width="252" height="18" rx="4" fill="#0f172a" stroke="#1e293b" />
    <text x="22" y="117" fill="#f59e0b" font-size="9" font-weight="700" class="hud-text">ROUTE: 35 MINS VIA ALS 108 AMBULANCE</text>
  </g>

  <!-- 3D FLOATING HUD CARD 3: MULTI-LINGUAL VOICE INTAKE -->
  <g class="card-3" transform="translate(620, 320)" filter="url(#cardShadow)">
    <rect x="0" y="0" width="280" height="120" rx="16" fill="url(#cardGrad)" stroke="#10b981" stroke-width="1.5" />
    <rect x="12" y="12" width="130" height="20" rx="6" fill="#064e3b" />
    <circle cx="22" cy="22" r="3.5" fill="#34d399" />
    <text x="32" y="26" fill="#6ee7b7" font-size="9" font-weight="800" class="hud-text">VOICE AI RECOGNITION</text>

    <!-- Mini Audio Waveform -->
    <g transform="translate(180, 16)">
      <rect x="0" y="2" width="3" height="14" rx="1.5" fill="#34d399" />
      <rect x="6" y="5" width="3" height="8" rx="1.5" fill="#34d399" />
      <rect x="12" y="0" width="3" height="18" rx="1.5" fill="#34d399" />
      <rect x="18" y="4" width="3" height="10" rx="1.5" fill="#34d399" />
      <rect x="24" y="1" width="3" height="16" rx="1.5" fill="#34d399" />
      <rect x="30" y="6" width="3" height="7" rx="1.5" fill="#34d399" />
    </g>

    <text x="14" y="60" fill="#ffffff" font-size="13" font-weight="600" class="title-text">"3 din se tez bukhar hai..."</text>
    <text x="14" y="78" fill="#94a3b8" font-size="10" class="hud-text">Dialects: Hindi, Bhojpuri, Bengali, English</text>
    <text x="14" y="98" fill="#38bdf8" font-size="10" font-weight="700" class="hud-text">✓ Real-Time Clinical Entity Extraction</text>
  </g>

  <!-- CENTRAL 3D FLOATING ISOMETRIC MEDICAL CROSS (Visual Centerpiece) -->
  <g transform="translate(800, 220)" class="floating-hero">
    <!-- Isometric Base Shadow -->
    <ellipse cx="0" cy="50" rx="42" ry="14" fill="#000000" opacity="0.5" />

    <!-- 3D Extruded Cross -->
    <!-- Shadow Side -->
    <path d="M -12 -30 L 12 -30 L 12 -12 L 30 -12 L 30 12 L 12 12 L 12 30 L -12 30 L -12 12 L -30 12 L -30 -12 L -12 -12 Z"
          fill="#991b1b" transform="translate(4, 6)" />

    <!-- Main Vibrant Cross -->
    <path d="M -12 -30 L 12 -30 L 12 -12 L 30 -12 L 30 12 L 12 12 L 12 30 L -12 30 L -12 12 L -30 12 L -30 -12 L -12 -12 Z"
          fill="url(#pulseRed)" filter="url(#glowRed)" />

    <!-- Inner Highlights -->
    <path d="M -8 -26 L 8 -26 L 8 -8 L 26 -8 L 26 8 L 8 8 L 8 26 L -8 26 L -8 8 L -26 8 L -26 -8 L -8 -8 Z"
          fill="#ffffff" opacity="0.3" />

    <!-- Orbiting Ring around Cross -->
    <ellipse cx="0" cy="0" rx="55" ry="24" fill="none" stroke="#38bdf8" stroke-width="2" stroke-dasharray="8, 6" opacity="0.8" transform="rotate(-20)" />
  </g>

  <!-- Tech Metadata Bottom Corner Tag -->
  <g transform="translate(1000, 485)">
    <text x="0" y="0" fill="#475569" font-size="10" class="hud-text" text-anchor="end">
      ArogyaSeva Engine v2.5 • OpenStreetMap • Gemini 2.5 Flash
    </text>
  </g>
</svg>
