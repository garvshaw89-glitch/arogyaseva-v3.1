<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <!-- Background Gradient: ArogyaSeva Midnight Clinical Navy -->
    <linearGradient id="arogyaBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0F284E" />
      <stop offset="50%" stop-color="#0B1F3A" />
      <stop offset="100%" stop-color="#061224" />
    </linearGradient>

    <!-- DNA Strand A Gradient: Electric Cyan to Sky Blue -->
    <linearGradient id="dnaStrandA" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38BDF8" />
      <stop offset="50%" stop-color="#00C2D7" />
      <stop offset="100%" stop-color="#0284C7" />
    </linearGradient>

    <!-- DNA Strand B Gradient: Medical Mint to Emerald Teal -->
    <linearGradient id="dnaStrandB" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#2DD4BF" />
      <stop offset="50%" stop-color="#19E6C1" />
      <stop offset="100%" stop-color="#10B981" />
    </linearGradient>

    <!-- Pulse Lifeline Gradient -->
    <linearGradient id="pulseWave" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00C2D7" stop-opacity="0.3" />
      <stop offset="30%" stop-color="#00C2D7" />
      <stop offset="50%" stop-color="#FFFFFF" />
      <stop offset="70%" stop-color="#19E6C1" />
      <stop offset="100%" stop-color="#19E6C1" stop-opacity="0.3" />
    </linearGradient>

    <!-- Outer Rim Glow Gradient -->
    <linearGradient id="rimGlow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00C2D7" stop-opacity="0.9" />
      <stop offset="50%" stop-color="#19E6C1" stop-opacity="0.4" />
      <stop offset="100%" stop-color="#00C2D7" stop-opacity="0.2" />
    </linearGradient>

    <!-- Soft Glow Filter -->
    <filter id="glowSubtle" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="1.5" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Squircle App Container with Premium Cyan Rim -->
  <rect x="2" y="2" width="60" height="60" rx="16" fill="url(#arogyaBg)" stroke="url(#rimGlow)" stroke-width="1.75" />

  <!-- Ambient Internal Medical Aura -->
  <circle cx="32" cy="32" r="22" fill="#00C2D7" opacity="0.08" />
  <circle cx="32" cy="22" r="14" fill="#19E6C1" opacity="0.06" />

  <!-- ============================================================
       DNA DOUBLE HELIX & NUCLEOTIDE BASE PAIR RUNGS
       ============================================================ -->
  <!-- Base-Pair Connecting Rungs (Cross-strands) -->
  <g stroke-linecap="round" opacity="0.75">
    <!-- Rung 1 -->
    <line x1="23" y1="15" x2="41" y2="15" stroke="#38BDF8" stroke-width="1.8" />
    <circle cx="32" cy="15" r="1.2" fill="#FFFFFF" />

    <!-- Rung 2 -->
    <line x1="26" y1="22" x2="38" y2="22" stroke="#00C2D7" stroke-width="1.8" />
    <circle cx="32" cy="22" r="1.2" fill="#FFFFFF" />

    <!-- Rung 3 (Center crossover behind ECG) -->
    <line x1="30" y1="29" x2="34" y2="29" stroke="#19E6C1" stroke-width="2" />

    <!-- Rung 4 -->
    <line x1="26" y1="36" x2="38" y2="36" stroke="#19E6C1" stroke-width="1.8" />
    <circle cx="32" cy="36" r="1.2" fill="#FFFFFF" />

    <!-- Rung 5 -->
    <line x1="23" y1="43" x2="41" y2="43" stroke="#2DD4BF" stroke-width="1.8" />
    <circle cx="32" cy="43" r="1.2" fill="#FFFFFF" />

    <!-- Rung 6 -->
    <line x1="26" y1="50" x2="38" y2="50" stroke="#00C2D7" stroke-width="1.8" />
    <circle cx="32" cy="50" r="1.2" fill="#FFFFFF" />
  </g>

  <!-- DNA Strand A: S-Curve Left to Right -->
  <path d="M 23 12 C 18 20, 46 25, 41 33 C 36 41, 18 45, 23 52"
        fill="none"
        stroke="url(#dnaStrandA)"
        stroke-width="3.2"
        stroke-linecap="round"
        filter="url(#glowSubtle)" />

  <!-- DNA Strand B: Inverted S-Curve Right to Left -->
  <path d="M 41 12 C 46 20, 18 25, 23 33 C 28 41, 46 45, 41 52"
        fill="none"
        stroke="url(#dnaStrandB)"
        stroke-width="3.2"
        stroke-linecap="round"
        filter="url(#glowSubtle)" />

  <!-- DNA Strand Spherical Nodes -->
  <g>
    <circle cx="23" cy="12" r="2.2" fill="#38BDF8" />
    <circle cx="41" cy="12" r="2.2" fill="#19E6C1" />
    <circle cx="41" cy="33" r="2.2" fill="#00C2D7" />
    <circle cx="23" cy="33" r="2.2" fill="#2DD4BF" />
    <circle cx="23" cy="52" r="2.2" fill="#38BDF8" />
    <circle cx="41" cy="52" r="2.2" fill="#19E6C1" />
  </g>

  <!-- ============================================================
       CENTRAL CLINICAL HEARTBEAT / ECG LIFELINE WAVEFORM
       ============================================================ -->
  <!-- Drop Shadow backing for ECG -->
  <path d="M 6 33 L 17 33 L 21 33 L 24 24 L 28 43 L 33 17 L 37 40 L 41 27 L 44 33 L 58 33"
        fill="none"
        stroke="#061224"
        stroke-width="4.5"
        stroke-linecap="round"
        stroke-linejoin="round"
        opacity="0.8" />

  <!-- Glowing ECG Waveform -->
  <path d="M 6 33 L 17 33 L 21 33 L 24 24 L 28 43 L 33 17 L 37 40 L 41 27 L 44 33 L 58 33"
        fill="none"
        stroke="url(#pulseWave)"
        stroke-width="2.6"
        stroke-linecap="round"
        stroke-linejoin="round"
        filter="url(#glowSubtle)" />

  <!-- Vital Peak Glowing Node -->
  <circle cx="33" cy="17" r="2.4" fill="#FFFFFF" filter="url(#glowSubtle)" />
  <circle cx="33" cy="17" r="1.2" fill="#00C2D7" />
</svg>
