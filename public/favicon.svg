<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0284c7" />
      <stop offset="50%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#090d16" />
    </linearGradient>
    <linearGradient id="crossGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ef4444" />
      <stop offset="100%" stop-color="#dc2626" />
    </linearGradient>
    <linearGradient id="pulseGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="50%" stop-color="#10b981" />
      <stop offset="100%" stop-color="#f59e0b" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="2" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background Shield/Rounded Container -->
  <rect x="2" y="2" width="60" height="60" rx="16" fill="url(#bgGrad)" stroke="#38bdf8" stroke-width="1.5" />

  <!-- Outer Ring with Subtle Glow -->
  <circle cx="32" cy="32" r="23" fill="none" stroke="#0ea5e9" stroke-width="1" stroke-dasharray="3, 3" opacity="0.6" />

  <!-- Medical Cross Shape -->
  <g filter="url(#glow)">
    <!-- Vertical Cross Bar -->
    <rect x="26.5" y="14" width="11" height="36" rx="4" fill="url(#crossGrad)" />
    <!-- Horizontal Cross Bar -->
    <rect x="14" y="26.5" width="36" height="11" rx="4" fill="url(#crossGrad)" />
    <!-- Inner Cross Highlight -->
    <rect x="29" y="16" width="6" height="32" rx="2" fill="#ffffff" opacity="0.3" />
    <rect x="16" y="29" width="32" height="6" rx="2" fill="#ffffff" opacity="0.3" />
  </g>

  <!-- Dynamic ECG Heartbeat Waveform -->
  <path d="M 8 32 L 21 32 L 24 24 L 28 42 L 33 19 L 37 39 L 41 29 L 44 32 L 56 32"
        fill="none"
        stroke="url(#pulseGrad)"
        stroke-width="3"
        stroke-linecap="round"
        stroke-linejoin="round"
        filter="url(#glow)" />

  <!-- Center Pulse Dot -->
  <circle cx="33" cy="19" r="2.5" fill="#ffffff" />
</svg>
